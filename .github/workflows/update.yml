# Holt die Spieldaten von nuLiga und veroeffentlicht die App auf GitHub Pages.
name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC (Winterzeit: deutsche Zeit = UTC + 1)
    - cron: "*/30 7-19 * * 6,0"   # Sa + So: alle 30 Minuten, 8 bis 21 Uhr
    - cron: "15 5 * * 1-5"        # Mo bis Fr: einmal morgens (Verlegungen, Spielberichte)
  push:
    branches: [main]
  workflow_dispatch:               # "Run workflow"-Knopf auf GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Daten von nuLiga holen
        shell: pwsh
        env:
          TZ: Europe/Berlin
        run: ./tools/update-data.ps1

      - name: Neue Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js tools/cache
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Daten aktualisiert"
            git push
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html data.js img _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
