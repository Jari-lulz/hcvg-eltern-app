# Holt die Spieldaten von nuLiga und veroeffentlicht die App auf GitHub Pages.
name: Daten aktualisieren

on:
  schedule:
    # Am Wochenende plus Mittwochabend, sonst finden keine Spiele statt.
    # Zeiten in UTC (Winterzeit: deutsche Zeit = UTC + 1, Sommerzeit: UTC + 2)
    - cron: "*/30 6-20 * * 6"     # Samstag: alle 30 Minuten, 7:00 bis 21:30 Uhr
    - cron: "*/30 6-16 * * 0"     # Sonntag: alle 30 Minuten, 7:00 bis 17:30 Uhr
    - cron: "0 17 * * 0"          # Sonntag: letztes Update um 18:00 Uhr
    - cron: "0 17 * * 3"          # Mittwoch 18:00 Uhr (falls ein Nachholspiel war)
  push:
    branches: [main]
  workflow_dispatch:               # "Run workflow"-Knopf auf GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Daten von nuLiga holen
        shell: pwsh
        env:
          TZ: Europe/Berlin
        run: ./tools/update-data.ps1

      - name: Neue Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js tools/cache *.ics
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Daten aktualisiert"
            git push
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html data.js img *.ics _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
