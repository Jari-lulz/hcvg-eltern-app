<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HCVG Mädels-Spieltag</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone column — sticky team switcher on top, "next game" scoreboard card, then lists. Court-floor navy + court-line yellow. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#0f1c33; --muted:#5a6680; --line:#d6dce8;
  --court:#16305e; --court-ink:#ffffff; --tape:#f2c230; --tape-ink:#1b1400;
  --us:#e6edfb; --win:#1e8a4c; --loss:#c23b3b; --draw:#8a6d1e;
  --accent:var(--court); --bar-them:#b9c3d6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d31; --ink:#e8edf7; --muted:#9aa6bf; --line:#26324a;
  --court:#1c3a70; --court-ink:#ffffff; --tape:#f2c230; --tape-ink:#1b1400;
  --us:#1a2a4a; --win:#4cc27e; --loss:#ff7a7a; --draw:#e0c068; --accent:var(--tape); --bar-them:#3a4866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d31; --ink:#e8edf7; --muted:#9aa6bf; --line:#26324a;
  --court:#1c3a70; --court-ink:#ffffff; --tape:#f2c230; --tape-ink:#1b1400;
  --us:#1a2a4a; --win:#4cc27e; --loss:#ff7a7a; --draw:#e0c068; --accent:var(--tape); --bar-them:#3a4866; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{padding-top:18px;display:flex;align-items:center;gap:12px}
header .ht{display:flex;flex-direction:column;gap:4px;min-width:0}
header .logo{width:56px;height:56px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
/* Team-Banner auf der Startseite */
figure.hero{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--court)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
figure.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,40,0) 35%,rgba(10,20,40,.88) 100%)}
.hero .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff;display:flex;flex-direction:column;gap:4px}
.hero .cap b{font:800 clamp(17px,5.7vw,32px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.hero .cap b i,.hero .cap b em{font-style:normal;display:inline-block}
.hero .cap b em{color:var(--tape)}

/* Animationen – nur wenn das Handy keine reduzierte Bewegung wünscht */
@media (prefers-reduced-motion:no-preference){
  #view.anim>*{animation:rise .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  #view.anim .hero img{animation:kb 2.4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes kb{from{transform:scale(1.14)}}
  #view.anim .hero .cap b>*{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.35s + var(--w)*.18s)}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.85)}}
  .count{animation:beat 2.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .cakeline .em{display:inline-block;animation:wiggle 2.2s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-5deg)}}
  #view.anim .hb .fill,#view.anim .gbar s,#view.anim .ks .bar i{animation:growx .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:.25s;transform-origin:left center}
  @keyframes growx{from{transform:scaleX(0)}}
  #view.anim .col .bar{animation:growy .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:.25s;transform-origin:bottom center}
  @keyframes growy{from{transform:scaleY(0)}}
  details[open] .gx{animation:rise .35s ease both}
  /* Spielverlauf deckt sich gleichmäßig von Anpfiff bis Schluss auf */
  details[open] .mom .plot svg{animation:reveal 3s linear .2s both}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .seg button{transition:background-color .25s,color .25s}
  .btn,.chip,.mapbtn{transition:transform .15s}
  .btn:active,.chip:active,.mapbtn:active{transform:scale(.96)}
}
.hero .cap span{font:600 13px/1.3 var(--body);opacity:.9}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(21px,6.6vw,34px)/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--court)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 span{color:var(--tape)}}
:root[data-theme="dark"] h1 span{color:var(--tape)}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0}
h3{font:700 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0}
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;border:0;background:transparent;color:var(--muted);padding:11px 2px;border-radius:9px;cursor:pointer;min-width:0}
.seg button[aria-selected="true"]{background:var(--court);color:var(--court-ink)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.sub button:focus-visible,summary:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

/* Unter-Navigation je Liga */
#view{width:100%}
#view,#view>*{min-width:0}
.sub{display:flex;gap:2px;border-bottom:2px solid var(--line);min-width:0}
.sub button{flex:1 1 auto;justify-content:center;font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;background:none;border:0;color:var(--muted);padding:12px 4px;margin-bottom:-2px;border-bottom:3px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sub button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
.sub .ld{width:8px;height:8px;border-radius:50%;background:var(--loss)}
.sub a{margin-left:auto;align-self:center;flex:none;font:700 14px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:6px}
.sub a:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

/* Scoreboard card */
.board{background:var(--court);color:var(--court-ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border:3px dashed rgba(255,255,255,.18);border-radius:50%;pointer-events:none}
.board .when{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.board .date{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.times>div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
.times small{flex-basis:100%;font:700 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.times b{font:800 34px/1.05 var(--display);font-variant-numeric:tabular-nums}
.times span{font-size:13px;opacity:.85}
.times .treff{background:var(--tape);color:var(--tape-ink)}
.count{font:800 14px/1 var(--display);background:var(--tape);color:var(--tape-ink);padding:6px 9px;border-radius:6px;letter-spacing:.06em;text-transform:uppercase}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.team{font:800 24px/1.05 var(--display);text-transform:uppercase;text-wrap:balance;min-width:0}
.team.away{text-align:right}
.team.us{color:var(--tape)}
.vs{font:700 14px/1 var(--display);opacity:.7}
.hall{font-size:14px;opacity:.92}
.hall b{display:block;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;font:600 14px/1 var(--body);text-decoration:none;border-radius:10px;padding:11px 14px;border:0;cursor:pointer}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--tape);color:var(--tape-ink)}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--court-ink)}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.lg{font:700 12px/1 var(--display);letter-spacing:.06em;padding:4px 6px;border-radius:5px;background:var(--tape);color:var(--tape-ink);text-transform:uppercase}

/* Training */
.train{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tape);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.train .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.train .new{font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--loss);color:#fff;padding:5px 7px;border-radius:5px}
.days{display:flex;flex-direction:column;gap:8px}
.day{background:var(--bg);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"d n w" "d t w";align-items:center;gap:0 10px}
.day b{grid-area:d;font:800 26px/1 var(--display);text-transform:uppercase;color:var(--accent)}
.day .dn{grid-area:n;font-size:13px;color:var(--muted)}
.day .tm{grid-area:t;font:700 20px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.day .who{grid-area:w;font:700 13px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.day .who.both{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.train .where{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.train .where>span{min-width:0}

/* Schlüsselspielerinnen (Gegner-Check, Liga) */
.kp{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.kn{display:flex;flex-direction:column;min-width:0}
.kn b{font-weight:700}
.ks{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center;font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.ks .bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.ks .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ai:not(.pos):not(.neg) .ic{background:var(--court)}
.kduel{display:grid;grid-template-columns:18px 1fr 1fr;gap:10px;align-items:start}
.kduel.head,.kduel.seven{grid-template-columns:1fr 1fr;padding-left:28px}
.kduel.head span{font:700 13px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kduel.head span:last-child{color:var(--accent)}
.kduel .kr{font:800 16px/1.2 var(--display);font-style:normal;color:var(--muted)}
.kc{display:flex;flex-direction:column;gap:3px;min-width:0}
.kc b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .ks{grid-template-columns:1fr 34px}
.kc.us .ks .bar i{background:var(--win)}
.kc .ks .bar i{background:var(--loss)}
.nr{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;margin-right:6px;border-radius:50%;background:var(--court);color:var(--court-ink);font:800 12px/1 var(--display);vertical-align:1px}
.kc.us .nr,tr.mine .nr{background:var(--win)}
.sb{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--loss);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sbh{display:flex;gap:12px;align-items:center}
.sbh div{display:flex;flex-direction:column;min-width:0}
.sbh b{font:800 20px/1.1 var(--display);text-transform:uppercase}
.sbn{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--loss);color:#fff;font:800 24px/1 var(--display)}
.sbp{display:flex;gap:6px;align-items:flex-end}
.sbp div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.sbp i{display:block;flex:none;width:70%;max-width:30px;background:var(--loss);opacity:.8;border-radius:4px 4px 0 0;min-height:2px}
.sbp .sbv{font:700 12px/1 var(--display);color:var(--muted)}
.sbp small{font-size:11px;color:var(--muted)}
.sbt{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.sbt b{font-weight:700}

/* Kalender-Abo */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cal .top{display:flex;gap:12px;align-items:flex-start}
.cal .top>svg{width:28px;height:28px;flex:none;color:var(--accent);margin-top:2px}
.cal .top div{display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .row .btn{flex:1 1 auto;justify-content:center}
.howto summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.howto p{margin:8px 0 0;font-size:14px}

/* Kuchen-Alarm: kleine Zeile auf der Startseite */
.cakeline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:2px dashed var(--tape);border-radius:14px;padding:10px 14px}
.cakeline .em{font-size:30px;line-height:1}
.cakeline div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cakeline small{font:700 11px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cakeline b{font:800 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.cakeline b i{font-style:normal;font:700 11px/1 var(--display);padding:2px 5px;border-radius:4px;background:var(--bg);color:var(--muted);vertical-align:middle}
.cakeline span{font-size:13px;color:var(--muted)}
.cakeline.due{background:var(--tape);border-style:solid;color:var(--tape-ink)}
.cakeline.due small,.cakeline.due span{color:var(--tape-ink);opacity:.8}
.cakeline.due b i{background:rgba(0,0,0,.12);color:var(--tape-ink)}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.g{display:grid;grid-template-columns:62px 1fr auto;gap:12px;padding:12px 14px;align-items:center}
.g.mine{background:var(--us)}
details.gd>summary{list-style:none;cursor:pointer;grid-template-columns:62px 1fr auto 14px}
details.gd>summary::-webkit-details-marker{display:none}
.chev{width:14px;height:14px;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.gx{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.gx .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}
.gx .meta b{color:var(--ink);font-weight:600}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc h4{font:700 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.sc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.sc li{display:flex;justify-content:space-between;gap:8px}
.sc li span:last-child{font-variant-numeric:tabular-nums;font-weight:700}
.sc .tt{margin-top:6px;font-size:12px;color:var(--muted)}
.mom{display:flex;flex-direction:column;gap:6px}
.mom h4{font:700 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.mg{display:grid;grid-template-columns:auto 1fr;gap:4px 6px}
.ax{display:flex;flex-direction:column;justify-content:space-between;font:600 11px/1 var(--body);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plot{position:relative;min-width:0;border-radius:6px;overflow:hidden}
.mom svg{width:100%;height:120px;display:block}
.zt{position:absolute;left:6px;font:700 11px/1 var(--body);letter-spacing:.02em;padding:2px 4px;border-radius:4px;background:color-mix(in srgb,var(--surface) 80%,transparent);pointer-events:none}
.zt.up{top:4px;color:var(--win)} .zt.dn{bottom:4px;color:var(--loss)}
.zt.mid{right:6px;left:auto;top:50%;transform:translateY(-120%);color:var(--muted);font-weight:600}
.ax .z{color:var(--ink);font-weight:800}
.mom .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mx{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.mx b{color:var(--ink);font-weight:600}
.mx b.up{color:var(--win)} .mx b.dn{color:var(--loss)}
.d{font:700 15px/1.1 var(--display);text-transform:uppercase;font-variant-numeric:tabular-nums}
.d small{display:block;font:500 12px/1.3 var(--body);color:var(--muted);text-transform:none}
.mt{min-width:0}
.mt .t{font-weight:600;overflow-wrap:anywhere}
.usn{color:var(--accent);font-weight:700}
.mt .h{font-size:13px;color:var(--muted)}
.res{font:800 20px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.res.w{color:var(--win)} .res.l{color:var(--loss)} .res.x{color:var(--draw)}
.res small{display:block;font:600 11px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.mapbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--court);color:var(--court-ink);text-decoration:none}
.mapbtn svg{width:18px;height:18px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;white-space:nowrap}
th{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
td{border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
td:first-child{font:800 18px/1 var(--display);text-align:center;color:var(--muted);width:34px}
td.pts{font:800 18px/1 var(--display)}
tr.mine td{background:var(--us);font-weight:700}
tr.mine td:first-child{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px/1 var(--body);padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.sub .ld{animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.35}}}
.note{font-size:13px;color:var(--muted)}
.empty{padding:16px;color:var(--muted)}

/* Statistik */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.kpi b{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);line-height:1.25}
.kpi.hero{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.kpi.hero b{color:var(--tape)}
.kpi.hero span{color:rgba(255,255,255,.8)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.col .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.col .bar{width:42%;max-width:26px;border-radius:5px 5px 0 0;position:relative;min-height:2px}
.col .bar i{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:700 12px/1 var(--display);font-style:normal;color:var(--muted)}
.col .bar.us{background:var(--accent)}
.col .bar.them{background:var(--bar-them)}
.col small{font-size:11px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ptbl td:first-child{font:700 14px/1 var(--display)}
.ptbl td.nm{font-weight:600}
.gbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.gbar s{display:block;height:8px;border-radius:4px;background:var(--accent);text-decoration:none;opacity:.85}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.hb .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.hb .fill{height:100%;background:var(--bar-them);border-radius:6px}
.hb.mine .tn{font-weight:700;color:var(--accent)}
.hb.mine .fill{background:var(--accent)}
.hb .v{text-align:right;font:700 16px/1 var(--display);font-variant-numeric:tabular-nums}
.medal{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:800 13px/1 var(--display);background:var(--bg);color:var(--muted)}
.medal.m1{background:#f2c230;color:#1b1400}.medal.m2{background:#c9d1dc;color:#1b2333}.medal.m3{background:#d9a36a;color:#2a1600}
.more{align-self:center}

/* Analyse */

.cmpt th:nth-child(2),.cmpt td:nth-child(2){text-align:right}

.ais{display:flex;flex-direction:column;gap:8px}
.ai{display:grid;grid-template-columns:30px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;align-items:start}
.ai .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 16px/1 var(--display);color:#fff}

.ai b{font-weight:700}
.ai p{margin:2px 0 0;font-size:14px;color:var(--muted)}

.focus li::before{content:counter(f);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:8px;background:var(--court);color:var(--court-ink);display:grid;place-items:center;font:800 18px/1 var(--display)}

</style>

<div class="wrap">
  <header>
    <img class="logo" src="img/logo.webp" alt="Wappen HC Vorpommern-Greifswald" width="56" height="56">
    <div class="ht">
      <h1>HC Vorpommern-<span>Greifswald</span></h1>
      <div class="eyebrow">Weibliche Jugend C &amp; D</div>
    </div>
  </header>

  <div class="switch">
    <div class="seg" role="tablist" aria-label="Ansicht">
      <button id="tab-us" role="tab" aria-selected="true" data-view="us">Start</button>
      <button id="tab-D" role="tab" aria-selected="false" data-view="D">D-Jugend</button>
      <button id="tab-C" role="tab" aria-selected="false" data-view="C">C-Jugend</button>
      <button id="tab-ana" role="tab" aria-selected="false" data-view="ana">Analyse</button>
    </div>
  </div>

  <main id="view" class="wrap" style="gap:22px"></main>

  <p class="note" id="stand"></p>
</div>

<script src="data.js"></script>
<script>
/* ---------- Von Hand gepflegt ---------- */

// Trainingszeiten: gepflegt in tools/training.json (gilt für App und Kalender), vom Skript nach data.js geschrieben
const TRAINING = window.HCVG_DATA?.training || {title:"Training",place:"",hall:"",days:[]};

const US = "HC Vorpommern-Greifswald";
// Hallen mit Adresse: gepflegt in tools/halls.json, vom Update-Skript nach data.js (hallInfo) geschrieben
const HALLS = window.HCVG_DATA?.hallInfo || {};
const SHORT = {
 "HC Vorpommern-Greifswald":"HC VG","Stavenhagener SV von 1863":"Stavenhagen","HSV 90 Waren":"Waren",
 "Pasewalker HV":"Pasewalk","SV Fort. 50 Neubrandenburg II":"Neubrandenburg II","HSV Grimmen 1992":"Grimmen",
 "Stralsunder HV II":"Stralsund II","HV Altentreptow":"Altentreptow","SV Motor Barth":"Barth",
 "Anklamer HV":"Anklam","Wolgaster HV 2000":"Wolgast","Platzhalter Endrundenspiele":"Gegner offen"
};
const LEN = {D:40, C:50};   // Spielzeit in Minuten

/* ---------- Daten aus data.js ---------- */
const DATA = window.HCVG_DATA;
const view = document.getElementById("view");
if(!DATA){ view.innerHTML='<div class="empty">Die Spieldaten (data.js) konnten nicht geladen werden.</div>'; throw new Error("data.js fehlt"); }
const LEAGUES = DATA.leagues;

const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MON=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sn = n => SHORT[n]||n;
const hallName = l => l ? (HALLS[l]?.[0] || DATA.halls?.[l] || "Halle") : "Halle offen";
const hallAddr = l => HALLS[l]?.[1] || "";
const hallCity = l => { const a=hallAddr(l); return a ? a.split(", ").pop() : ""; };
const mapsUrl = l => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(hallName(l)+(hallAddr(l)?", "+hallAddr(l):""));
const liveUrl = g => "https://hbde-live.liga.nu/nuScoreLive/#/groups/"+g;
const nuUrl = g => "https://hvmv-handball.liga.nu/cgi-bin/WebObjects/nuLigaHBDE.woa/wa/groupPage?championship=BHV+Ost+26%2F27&group="+g;
const ICON_PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>';
const ICON_LIVE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>';
const ICON_CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const fmt1 = n => (Math.round(n*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const pct = (a,b) => b ? Math.round(a/b*100)+" %" : "–";

function toGame(r,lg){
  let [date,time,loc,home,away,res,note,mid,ref]=r;
  if(time==="00:00" && !loc) time="";
  let dt=null;
  if(date){const [d,m,y]=date.split(".").map(Number);const [hh,mm]=(time||"00:00").split(":").map(Number);dt=new Date(y,m-1,d,hh,mm);}
  return {dt,date,time,loc,home,away,res,note:note||"",mid,ref:ref||"",lg,mine:home===US||away===US};
}
const ALL = Object.entries(LEAGUES).flatMap(([k,L])=>L.games.map(r=>toGame(r,k)));
const report = g => g.mid ? LEAGUES[g.lg].reports?.[g.mid] : null;

// Unsere Spielerinnen nur mit erstem Vornamen ("Annie Lea L." -> "Annie").
// Gibt es den Vornamen in beiden Jugenden zusammen mehrfach, bleibt das Kürzel ("Leni W.", "Leni G.").
const OUR_NAME=(()=>{
  const full=new Set();
  for(const g of ALL){ if(!g.mine) continue; const s=report(g)?.[g.home===US?"h":"a"]; for(const p of s?.p||[]) full.add(p[1]); }
  const first=n=>n.split(" ")[0], count={};
  for(const n of full) count[first(n)]=(count[first(n)]||0)+1;
  const m={}; for(const n of full){ const f=first(n), ini=n.trim().split(" ").pop(); m[n]=count[f]>1?`${f} ${ini}`:f; }
  return m;
})();
const pName=(name,team)=>team===US&&OUR_NAME[name]?OUR_NAME[name]:name;

function outcome(g){
  if(!g.res||!g.mine) return "";
  const [h,a]=g.res.split(":").map(Number);const us=g.home===US?h:a, th=g.home===US?a:h;
  return us>th?"w":us<th?"l":"x";
}
function dLabel(g){
  if(!g.dt) return `<div class="d">offen<small>Termin</small></div>`;
  return `<div class="d">${WD[g.dt.getDay()]} ${g.dt.getDate()}. ${MON[g.dt.getMonth()]}<small>${g.time?g.time+" Uhr":"Zeit offen"}</small></div>`;
}
function teamHtml(n){return n===US?`<span class="usn">${esc(sn(n))}</span>`:esc(sn(n));}
function hallLine(g){
  const parts=[esc(hallName(g.loc))+(hallCity(g.loc)?", "+esc(hallCity(g.loc)):"")];
  if(g.note) parts.push(esc(g.note));
  if(!g.res && g.ref) parts.push("SR: "+esc(g.ref));
  return parts.join(" · ");
}
function gameRow(g,{showLg=false}={}){
  const o=outcome(g);
  const head=`${dLabel(g)}<div class="mt"><div class="t">${showLg?`<span class="lg">${g.lg}</span> `:""}${teamHtml(g.home)} – ${teamHtml(g.away)}</div><div class="h">${hallLine(g)}</div></div>`;
  if(g.res){
    const right=`<div class="res ${o}">${esc(g.res)}${o?`<small>${o==="w"?"Sieg":o==="l"?"Niederlage":"Remis"}</small>`:""}</div>`;
    return `<details class="gd"><summary class="g ${g.mine?"mine":""}">${head}${right}${ICON_CHEV}</summary>${gameDetail(g)}</details>`;
  }
  const right = g.loc
    ? `<a class="mapbtn" href="${mapsUrl(g.loc)}" target="_blank" rel="noopener" aria-label="Route zur ${esc(hallName(g.loc))} in Google Maps">${ICON_PIN}</a>`
    : `<span></span>`;
  return `<div class="g ${g.mine?"mine":""}">${head}${right}</div>`;
}

/* Spieldetails: Halbzeit, Schiris, Torschützinnen, Spielverlauf */
let svgId=0;
function momentum(r,len,persp,upName,downName){
  const T=len*60, W=300, H=110; let d=0; const pts=[[0,0]];
  for(const [s,side,c] of r.ev||[]){ if(c==="g"||c==="7g"){ d+= side===persp?1:-1; pts.push([Math.min(s,T),d]); } }
  if(pts.length<2) return "";
  const max=Math.max(3,...pts.map(p=>Math.abs(p[1])));
  const x=s=>(s/T*W).toFixed(1), y=v=>(H/2 - v/max*(H/2-4)).toFixed(1);
  let line=`M0 ${y(0)}`; for(const [s,v] of pts.slice(1)) line+=` H${x(s)} V${y(v)}`; line+=` H${W}`;
  const area=line+` V${y(0)} H0 Z`; const id="m"+(++svgId);
  return `<div class="mom"><h4>Spielverlauf: Wer lag wie weit vorn?</h4>
  <div class="mg"><div class="ax" aria-hidden="true"><span>+${max}</span><span class="z">0</span><span>+${max}</span></div>
  <div class="plot">
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Verlauf der Tordifferenz">
    <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${H/2}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${H/2}" width="${W}" height="${H/2}"/></clipPath></defs>
    <rect x="0" y="0" width="${W}" height="${H/2}" fill="var(--win)" opacity=".08"/>
    <rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="var(--loss)" opacity=".08"/>
    <path d="${area}" clip-path="url(#${id}a)" fill="var(--win)" opacity=".35"/>
    <path d="${area}" clip-path="url(#${id}b)" fill="var(--loss)" opacity=".35"/>
    <line x1="${W/2}" x2="${W/2}" y1="0" y2="${H}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke" opacity=".7"/>
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".7"/>
    <path class="ln" d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  </svg>
  <span class="zt up">▲ ${esc(upName)} führt</span><span class="zt mid">Mittellinie = Gleichstand</span><span class="zt dn">▼ ${esc(downName)} führt</span>
  </div>
  <span></span><div class="lbl"><span>Anpfiff</span><span>Halbzeit</span><span>${len}. Min.</span></div></div></div>`;
}
function scorerList(name,s){
  const list=(s?.p||[]).filter(p=>p[3]>0).sort((a,b)=>b[3]-a[3]);
  const items=list.map(p=>`<li><span>${esc(pName(p[1],name))}${p[5]?` <span class="note">(7m ${p[4]}/${p[5]})</span>`:""}</span><span>${p[3]}</span></li>`).join("")||'<li class="note">keine Angaben</li>';
  const tt=s?`7m ${s.g7}/${s.s7} · Gelb ${s.y} · 2-Min ${s.m2}${s.d?` · Disq. ${s.d}`:""} · Auszeiten ${s.to}`:"";
  return `<div><h4>${teamHtml(name)}</h4><ul>${items}</ul><div class="tt">${tt}</div></div>`;
}
function gameDetail(g){
  const r=report(g);
  if(!r) return `<div class="gx"><span class="note">Für dieses Spiel gibt es noch keinen Spielbericht.</span></div>`;
  const persp = g.mine ? (g.home===US?1:2) : 1;
  const meta=[];
  if(r.ht) meta.push(`Halbzeit <b>${esc(r.ht)}</b>`);
  meta.push(`Schiedsrichter <b>${r.sr?.length?esc(r.sr.join(", ")):"–"}</b>`);
  const up = persp===1?g.home:g.away, dn = persp===1?g.away:g.home;
  const mom=momentum(r,LEN[g.lg],persp,sn(up),sn(dn));
  return `<div class="gx"><div class="meta"><span>${meta.join("</span><span>")}</span></div>${mom}<div class="sc">${scorerList(g.home,r.h)}${scorerList(g.away,r.a)}</div></div>`;
}

function countdown(dt){
  const now=new Date();const days=Math.round((new Date(dt.getFullYear(),dt.getMonth(),dt.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  if(days<=0) return "Heute";
  if(days===1) return "Morgen";
  return `in ${days} Tagen`;
}
const now=()=>new Date();
const upcoming = list => list.filter(g=>!g.res && (!g.dt || g.dt.getTime()+2*3600e3>now().getTime())).sort((a,b)=>(a.dt?a.dt:Infinity)-(b.dt?b.dt:Infinity));
const played = list => list.filter(g=>g.res).sort((a,b)=>b.dt-a.dt);

/* ---------- Statistik berechnen ---------- */
const statCache={};
function leagueStats(k){
  if(statCache[k]) return statCache[k];
  const L=LEAGUES[k], nb=Math.ceil(LEN[k]/10);
  const teams={}, players={};
  const T=n=>teams[n]||(teams[n]={name:n,gp:0,w:0,x:0,l:0,gf:0,ga:0,s7:0,g7:0,y:0,m2:0,d:0,to:0,rg:0,htLead:0,htGp:0,b:Array(nb).fill(0),bA:Array(nb).fill(0),best:null});
  for(const g of ALL.filter(g=>g.lg===k&&g.res)){
    const [hg,ag]=g.res.split(":").map(Number);
    const H=T(g.home), A=T(g.away);
    H.gp++;A.gp++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
    if(hg>ag){H.w++;A.l++;}else if(hg<ag){A.w++;H.l++;}else{H.x++;A.x++;}
    for(const [t,o,diff] of [[H,A,hg-ag],[A,H,ag-hg]]) if(diff>0 && (!t.best||diff>t.best.diff)) t.best={diff,g,vs:o.name};
    const r=report(g); if(!r) continue;
    const byNr={1:{},2:{}};   // Rückennummer -> Spielerin, je Seite in diesem Spiel
    for(const [side,t,name,sn_] of [["h",H,g.home,1],["a",A,g.away,2]]){
      const s=r[side]; if(!s) continue;
      t.rg++; t.s7+=s.s7; t.g7+=s.g7; t.y+=s.y; t.m2+=s.m2; t.d+=s.d; t.to+=s.to;
      for(const p of s.p||[]){
        const key=p[2]||name+"|"+p[1];
        const pl=players[key]||(players[key]={name:p[1],team:name,gp:0,g:0,g7:0,a7:0,m2:0,d:0,nrs:{},b:Array(nb).fill(0),h1:0,h2:0,first:0,late:0});
        pl.gp++;pl.g+=p[3];pl.g7+=p[4];pl.a7+=p[5];pl.m2+=p[7];pl.d+=p[8];
        if(p[0]) { pl.nrs[p[0]]=(pl.nrs[p[0]]||0)+1; byNr[sn_][p[0]]=pl; }
      }
    }
    if(r.ht){const [a,b]=r.ht.split(":").map(Number);H.htGp++;A.htGp++;if(a>b)H.htLead++;else if(b>a)A.htLead++;}
    const half=LEN[k]*30;
    for(const [s,side,c,nr] of r.ev||[]){
      if(c!=="g"&&c!=="7g") continue;
      const i=Math.min(nb-1,Math.floor(Math.max(0,s-1)/600));
      if(side===1){H.b[i]++;A.bA[i]++;} else if(side===2){A.b[i]++;H.bA[i]++;}
      const pl=nr&&byNr[side]?.[nr];   // Torzeit der Werferin zuordnen
      if(pl){ pl.b[i]++; if(s<=half) pl.h1++; else pl.h2++; if(s<=600) pl.first++; if(s>LEN[k]*60-600) pl.late++; }
    }
  }
  for(const pl of Object.values(players)){ const e=Object.entries(pl.nrs||{}).sort((a,b)=>b[1]-a[1]); pl.nr=e.length?+e[0][0]:null; }
  return statCache[k]={teams,players:Object.values(players),nb};
}

/* ---------- Ansichten ---------- */
function trainingTile(){
  const t=TRAINING;
  return `<section class="train" aria-label="Trainingszeiten">
    <div class="top"><h2>${esc(t.title)}</h2>${t.isNew?'<span class="new">Neu</span>':""}</div>
    <div class="days">${t.days.map(([a,full,time,who])=>`<div class="day">
      <b>${esc(a)}</b><span class="dn">${esc(full)}${who==="CD"?" · beide zusammen":""}</span>
      <span class="tm">${time?esc(time)+" Uhr":"Uhrzeit folgt"}</span>
      <span class="who ${who==="CD"?"both":""}">${who==="CD"?"C + D":esc(who)+"-Jugend"}</span></div>`).join("")}</div>
    <div class="where"><span><b>${esc(t.place)}</b><br><span class="note">${esc(hallName(t.hall))} · ${esc(hallAddr(t.hall))}</span></span>
      <a class="btn line" href="${mapsUrl(t.hall)}" target="_blank" rel="noopener">${ICON_PIN} Google Maps</a></div>
  </section>`;
}

const WDL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const hhmm = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");

// Karte "Nächstes Spiel" je Jugend: Treff (1 Stunde vorher), Anwurf, Countdown, Route, Live-Ticker
function nextCard(k){
  const L=LEAGUES[k];
  const g=upcoming(ALL.filter(x=>x.mine&&x.lg===k)).find(x=>x.dt);
  if(!g) return `<section class="board" aria-label="Nächstes Spiel ${k}-Jugend"><div class="when"><span class="lg">${k}-Jugend</span></div><p class="hall" style="margin:0">Zurzeit ist kein Spiel angesetzt.</p></section>`;
  const home=g.home===US;
  const times = g.time
    ? `<div class="times"><div class="treff"><small>Treff</small><b>${hhmm(new Date(g.dt-3600e3))}</b><span>Uhr</span></div><div><small>Anwurf</small><b>${esc(g.time)}</b><span>Uhr</span></div></div>`
    : `<div class="times"><div><small>Anwurf</small><b style="font-size:22px">Uhrzeit offen</b></div></div>`;

/* Kuchen-Regel: Wer in einem Spiel das 30. Tor für uns wirft, bringt zum nächsten Training Kuchen mit.
   Die Werferin kommt aus data.js (leagues[k].cake = {Bericht-ID: Name}, aus der nuScore-Ereignisliste). */
const CAKE_FRESH_DAYS=10;   // so lange steht der Hinweis nach dem Spiel auf der Startseite
function cakeGames(k){
  const map=LEAGUES[k].cake||{};
  return ALL.filter(g=>g.lg===k&&g.mine&&g.res&&map[g.mid]).sort((a,b)=>a.dt-b.dt)
    .map(g=>({name:map[g.mid],k,dt:g.dt,opp:sn(g.home===US?g.away:g.home),home:g.home===US,res:g.res}));
}
// Fällig ist nur das letzte Spiel je Jugend – also höchstens zwei Kuchen (D und C).
function cakeDue(){
  const out=[], nowT=Date.now();
  for(const k of ["C","D"]){
    const last=played(ALL.filter(g=>g.lg===k&&g.mine))[0];
    const name=last&&(LEAGUES[k].cake||{})[last.mid];
    if(name&&nowT-last.dt.getTime()<=CAKE_FRESH_DAYS*864e5) out.push({name,k,dt:last.dt,opp:sn(last.home===US?last.away:last.home),home:last.home===US});
  }
  return out;
}
const CAKE_LINES=[
  "Der Rest der Mannschaft atmet auf – und hält beim nächsten Training schon die Gabel bereit.",
  "Der Rest der Mannschaft atmet auf. Handball-Gesetz §30: Wer das 30. Tor wirft, backt. Einspruch zwecklos!",
  "Der Rest der Mannschaft atmet auf und gibt schon mal die Bestellung auf: gern mit Schokolade!",
  "Der Rest der Mannschaft atmet auf. Erst Torjägerin, jetzt Bäckerin – das nennt man Allrounderin."
];
const cakeLine=c=>CAKE_LINES[[...c.name+c.k].reduce((s,ch)=>s+ch.charCodeAt(0),0)%CAKE_LINES.length];
// Wenn gerade niemand dran ist – wechselt jede Woche
const CAKE_EMPTY=[
  "Wer im nächsten Spiel das 30. Tor wirft, schwingt den Kochlöffel.",
  "Der Ofen ist vorgeheizt – es fehlt nur noch das 30. Tor.",
  "Die Gabeln liegen bereit. Das 30. Tor leider noch nicht.",
  "Das Rezept liegt schon da. Gesucht: die Torschützin Nr. 30."
];
// Kleine Zeile auf der Startseite: immer sichtbar, zeigt wer den nächsten Kuchen mitbringt (höchstens D und C)
function cakeTile(){
  const due=cakeDue();
  if(!due.length){
    const wk=Math.floor(Date.now()/(7*864e5));
    return `<section class="cakeline" aria-label="Kuchen-Alarm"><span class="em" aria-hidden="true">🎂</span><div><small>Kuchen-Alarm · nächster Kuchen</small><b>Noch frei!</b><span>${esc(CAKE_EMPTY[wk%CAKE_EMPTY.length])}</span></div></section>`;
  }
  const names=due.map(c=>`${esc(pName(c.name,US))} <i>${c.k}</i>`).join(" &amp; ");
  const c0=due[0];
  return `<section class="cakeline due" aria-label="Kuchen-Alarm"><span class="em" aria-hidden="true">🎂</span><div><small>Kuchen-Alarm · nächster Kuchen</small><b>${names} ${due.length>1?"bringen":"bringt"} Kuchen mit!</b><span>Glückwunsch zum 30. Tor! ${esc(cakeLine(c0))}</span></div></section>`;
}

  const ours=S.players.filter(p=>p.team===US).sort(sorters[st.sort[k]]);

/* ---------- Analyse: Stärken, Baustellen, Trainingsschwerpunkte ----------
   Regelbasiert aus den Spielberichten. Jede Regel vergleicht HC VG mit der Liga
   und liefert einen Pluspunkt oder eine Baustelle (mit Gewicht w für die Reihenfolge). */
function analyse(k){
  const S=leagueStats(k), me=S.teams[US];
  if(!me||!me.gp) return null;
  const T=Object.values(S.teams).filter(t=>t.gp), n=T.length;
  const rankOf=(fn,lowGood)=>{const v=fn(me);return 1+T.filter(t=>lowGood?fn(t)<v:fn(t)>v).length;};
  const avg=fn=>T.reduce((s,t)=>s+fn(t),0)/n;
  const plus=[], minus=[];
  const top3=Math.max(1,Math.round(n/3)), low3=n-top3+1;
  // Vergleich: Liga-Schnitt und bestes anderes Team
  const others=T.filter(t=>t!==me);
  const bestOther=(fn,lowGood)=>others.reduce((b,t)=>!b||(lowGood?fn(t)<fn(b):fn(t)>fn(b))?t:b,null);
  const cmp=(fn,lowGood,f)=>{const b=bestOther(fn,lowGood);return ` Liga-Schnitt: ${f(avg(fn))}.${b?` Bestes anderes Team: ${esc(sn(b.name))} mit ${f(fn(b))}.`:""}`;};
  const pc=v=>Math.round(v*100)+" %";

  // Angriff / Abwehr
  const gf=t=>t.gf/t.gp, ga=t=>t.ga/t.gp;
  const rA=rankOf(gf), rD=rankOf(ga,true);
  if(rA<=top3) plus.push({w:4-rA/n,t:"Torgefährlicher Angriff",x:`${fmt1(gf(me))} Tore pro Spiel – Platz ${rA} von ${n} in der Liga.`+cmp(gf,false,fmt1)});
  else if(rA>=low3) minus.push({w:3,t:"Zu wenig Tore",x:`Nur ${fmt1(gf(me))} Tore pro Spiel (Platz ${rA} von ${n}).`+cmp(gf,false,fmt1),
    f:["Torabschluss","Würfe aus vollem Lauf, Tempogegenstoß nach Ballgewinn, Wurfvarianten von Außen und Rückraum."]});
  if(rD<=top3) plus.push({w:4.2-rD/n,t:rD===1?"Beste Abwehr der Liga":"Stabile Abwehr",x:`Nur ${fmt1(ga(me))} Gegentore pro Spiel – Platz ${rD} von ${n}.`+cmp(ga,true,fmt1)});
  else if(rD>=low3) minus.push({w:3.2,t:"Viele Gegentore",x:`${fmt1(ga(me))} Gegentore pro Spiel (Platz ${rD} von ${n}).`+cmp(ga,true,fmt1),
    f:["Abwehrarbeit","1-gegen-1, gemeinsames Verschieben, Rückzug nach Ballverlust."]});

  // Torhüterinnen: Paraden stehen nicht im Spielbericht. Wenige Gegentore sind aber auch ihr Verdienst,
  // und bei gegnerischen Siebenmetern sieht man ihren Anteil direkt.
  let o7=0,og7=0;
  for(const g of ALL.filter(x=>x.lg===k&&x.mine&&x.res)){const s=report(g)?.[g.home===US?"a":"h"]; if(s){o7+=s.s7; og7+=s.g7;}}
  const q=t=>t.s7?t.g7/t.s7:0, qa=avg(q);
  const keeper=[];
  if(rD<=top3) keeper.push(`Nur ${fmt1(ga(me))} Gegentore pro Spiel sind nicht nur Abwehrarbeit, sondern auch ein starker Rückhalt im Tor.`);
  if(o7>=3&&og7/o7<=qa-0.1) keeper.push(`Gegnerinnen haben nur ${og7} von ${o7} Siebenmetern gegen uns verwandelt (${pct(og7,o7)}, Liga-Schnitt ${pc(qa)}).`);
  if(keeper.length) plus.push({w:rD<=top3?4.19-rD/n:2.2,t:"Starke Torhüterinnen",x:keeper.join(" ")+" Gehaltene Würfe werden im Spielbericht leider nicht gezählt, deshalb tauchen Paraden sonst nirgends auf."});
  if(me.s7>=5){
    if(q(me)>=qa+0.07) plus.push({w:2,t:"Sicher vom Siebenmeter",x:`${me.g7} von ${me.s7} verwandelt (${pct(me.g7,me.s7)}).`+cmp(q,false,pc)});
    else if(q(me)<=qa-0.07||q(me)<0.55) minus.push({w:2.5+(qa-q(me))*5,t:"Siebenmeter-Quote",x:`Nur ${me.g7} von ${me.s7} verwandelt (${pct(me.g7,me.s7)}).`+cmp(q,false,pc),
      f:["Siebenmeter","Am Ende jedes Trainings ein paar Siebenmeter unter Druck: feste Werferinnen, eigene Wurfecke, Torhüterin als Gegnerin."]});
  }

  // Fairness / Strafen
  const pen=t=>t.rg?(t.y+t.m2+t.d)/t.rg:0, pa=avg(pen);
  if(me.rg){
    if(pen(me)<=pa*0.75) plus.push({w:1.5,t:"Faire Abwehr",x:`${fmt1(pen(me))} Strafen pro Spiel.`+cmp(pen,true,fmt1)});
    else if(pen(me)>=pa*1.3) minus.push({w:2,t:"Viele Strafen",x:`${fmt1(pen(me))} Strafen pro Spiel.`+cmp(pen,true,fmt1),
      f:["Fair verteidigen","Beinarbeit statt Klammern: Gegnerin mit dem Körper stellen, Arme hoch."]});
  }

  // Vergleichstabelle für die Ansicht
  const gd=t=>(t.gf-t.ga)/t.gp, sgn=v=>(v>0?"+":"")+fmt1(v);
  const rows=[["Tore pro Spiel",gf,false,fmt1],["Gegentore pro Spiel",ga,true,fmt1],["Tordifferenz pro Spiel",gd,false,sgn],["7-Meter-Quote",q,false,pc],["Strafen pro Spiel",pen,true,fmt1]]
    .map(([l,fn,lg,f])=>{const b=bestOther(fn,lg);return {l,me:f(fn(me)),avg:f(avg(fn)),best:b?f(fn(b)):"–",bn:b?sn(b.name):"",rk:rankOf(fn,lg),lg};});

  // Erste vs. zweite Halbzeit
  const our=ALL.filter(g=>g.lg===k&&g.mine&&g.res);
  let h1=0,h2=0,nh=0;
  for(const g of our){const r=report(g); if(!r?.ht) continue;
    const [a,b]=r.ht.split(":").map(Number), [c,d]=g.res.split(":").map(Number), home=g.home===US;
    const d1=home?a-b:b-a, dt=home?c-d:d-c; h1+=d1; h2+=dt-d1; nh++;}
  if(nh>=2){
    const a1=h1/nh, a2=h2/nh, f=v=>(v>0?"+":"")+fmt1(v);
    if(a2-a1>=1.5) plus.push({w:2+Math.min(1,(a2-a1)/5),t:"Stark in der zweiten Halbzeit",x:`Tordifferenz pro Spiel: 1. Halbzeit ${f(a1)}, 2. Halbzeit ${f(a2)}. Die Mannschaft legt nach der Pause zu.`});
    else if(a1-a2>=1.5) minus.push({w:2+Math.min(1,(a1-a2)/5),t:"Nachlassen nach der Pause",x:`Tordifferenz pro Spiel: 1. Halbzeit ${f(a1)}, 2. Halbzeit ${f(a2)}.`,
      f:["Kraft bis zum Schluss","Ausdauer- und Intervalleinheiten, Spielformen mit Aufgaben in müdem Zustand."]});
    if(me.htLead===me.htGp&&me.htGp>=2) plus.push({w:1.8,t:"Immer vorn zur Pause",x:`In allen ${me.htGp} Spielen mit Spielbericht zur Halbzeit in Führung.`});
  }

  // Start- und Schlussphase (je 10 Minuten)
  const nb=S.nb, per=v=>v/me.rg;
  if(me.rg>=2){
    const s0=per(me.b[0]-me.bA[0]), sL=per(me.b[nb-1]-me.bA[nb-1]);
    if(s0>=1) plus.push({w:1.6,t:"Blitzstart",x:`In den ersten 10 Minuten im Schnitt ${fmt1(s0)} Tore besser als der Gegner.`});
    else if(s0<=-0.7) minus.push({w:1.8+Math.min(1,-s0/3),t:"Holpriger Start",x:`In den ersten 10 Minuten im Schnitt ${fmt1(-s0)} Tore hinten.`,
      f:["Wach ins Spiel","Aufwärmen mit Wettkampfcharakter, klare Aufgaben für die ersten Angriffe."]});
    if(sL>=1) plus.push({w:1.6,t:"Starke Schlussphase",x:`In den letzten 10 Minuten im Schnitt ${fmt1(sL)} Tore besser als der Gegner.`});
    else if(sL<=-0.5) minus.push({w:1.7+Math.min(1,-sL/3),t:"Schlussphase",x:`In den letzten 10 Minuten im Schnitt ${fmt1(-sL)} Tore weniger als der Gegner (${me.b[nb-1]}:${me.bA[nb-1]} insgesamt).`,
      f:["Konzentration am Ende","Spielformen mit Spielstand und Zeit („noch 5 Minuten, 2 Tore hinten“), Wechsel bewusst planen."]});
  }

  // Verteilung der Tore
  const ours=S.players.filter(p=>p.team===US&&p.g>0).sort((a,b)=>b.g-a.g);
  const tot=ours.reduce((s,p)=>s+p.g,0);
  if(tot>=20){
    const share=ours[0].g/tot, many=ours.filter(p=>p.g/tot>=0.08).length;
    if(share>=0.35) minus.push({w:1.6+share,t:"Tore hängen an wenigen",x:`${Math.round(share*100)} % der Tore wirft eine einzige Spielerin.`,
      f:["Torgefahr verteilen","Spielzüge, die gezielt Außen und Kreis einbinden, damit der Gegner nicht nur eine Spielerin decken muss."]});
    else if(many>=5) plus.push({w:1.4+many/10,t:"Torgefahr auf vielen Schultern",x:`${many} Spielerinnen haben jeweils mindestens 8 % der Tore geworfen.`});
  }

  // Enge Spiele (höchstens 3 Tore Unterschied)
  let cw=0,cl=0;
  for(const g of our){const [h,a]=g.res.split(":").map(Number); const d=g.home===US?h-a:a-h; if(Math.abs(d)<=3&&d!==0){d>0?cw++:cl++;}}
  if(cw+cl>=2){ if(cw>cl) plus.push({w:1.5,t:"Nervenstark in engen Spielen",x:`${cw} von ${cw+cl} knappen Spielen gewonnen.`});
    else if(cl>cw) minus.push({w:1.7,t:"Knappe Spiele",x:`${cl} von ${cw+cl} knappen Spielen verloren.`,f:["Ruhe in engen Phasen","Auszeit-Situationen üben, sichere Angriffe statt schneller Würfe."]}); }

  plus.sort((a,b)=>b.w-a.w); minus.sort((a,b)=>b.w-a.w);
  const rank=LEAGUES[k].table.findIndex(r=>r[0]===US)+1;
  const lead=LEAGUES[k].table[0];
  return {plus,minus,focus:minus.filter(m=>m.f).slice(0,3),rank,n:LEAGUES[k].table.length,me,rg:me.rg,rows,nT:n,leader:lead&&lead[0]!==US?[sn(lead[0]),lead[7]]:null};
}

/* ---------- Gegner-Check und Liga-Analyse ---------- */
const segLabel=(k,i)=>`${i*10}.–${Math.min((i+1)*10,LEN[k])}. Minute`;
const realTeam=n=>!/Platzhalter/.test(n);
// Profil einer Mannschaft aus allen Spielberichten der Liga
function teamProfile(k,name){
  const S=leagueStats(k), t=S.teams[name]; if(!t||!t.gp) return null;
  let h1=0,h2=0,nh=0;
  for(const g of ALL){ if(g.lg!==k||!g.res||(g.home!==name&&g.away!==name)) continue; const r=report(g); if(!r?.ht) continue;
    const home=g.home===name, [a,b]=r.ht.split(":").map(Number), [c,d]=g.res.split(":").map(Number);
    const d1=home?a-b:b-a; h1+=d1; h2+=(home?c-d:d-c)-d1; nh++; }
  const players=S.players.filter(p=>p.team===name&&p.g>0).sort((a,b)=>b.g-a.g);
  const tot=players.reduce((s,p)=>s+p.g,0);
  const seven=S.players.filter(p=>p.team===name&&p.a7>0).sort((a,b)=>b.a7-a.a7||b.g7-a.g7)[0]||null;
  const maxI=arr=>arr.reduce((bi,v,i)=>v>arr[bi]?i:bi,0);
  const row=LEAGUES[k].table.findIndex(r=>r[0]===name);
  return {t,h1:nh?h1/nh:0,h2:nh?h2/nh:0,nh,players,tot,seven,segBest:maxI(t.b),segWorst:maxI(t.bA),
    rank:row+1,pts:row>=0?LEAGUES[k].table[row][7]:"–",pen:t.rg?(t.y+t.m2+t.d)/t.rg:0,q7:t.s7?t.g7/t.s7:null};
}
const nrTag=p=>p&&p.nr!=null?`<span class="nr">${p.nr}</span>`:"";
// Steckbrief-Merkmale einer Spielerin aus Torzeiten, 7m und Anteil
function playerTraits(k,p,tot){
  const tr=[], tracked=p.b?p.b.reduce((s,v)=>s+v,0):0;
  if(tot&&p.g/tot>=0.3) tr.push(["Torjägerin",`${Math.round(p.g/tot*100)} % der Tore ihres Teams`]);
  if(p.a7>=3) tr.push(["7m-Schützin",`${p.g7} von ${p.a7} verwandelt`]);
  if(tracked>=5){
    const bi=p.b.reduce((m,v,i)=>v>p.b[m]?i:m,0);
    tr.push(["Gefährlichste Phase",`${segLabel(k,bi)} (${p.b[bi]} Tore)`]);
    if(p.h2>=p.h1*1.6&&p.h2-p.h1>=3) tr.push(["Stark nach der Pause",`${p.h1} Tore in der 1., ${p.h2} in der 2. Halbzeit`]);
    else if(p.h1>=p.h2*1.6&&p.h1-p.h2>=3) tr.push(["Stark vor der Pause",`${p.h1} Tore in der 1., ${p.h2} in der 2. Halbzeit`]);
    if(p.first/tracked>=0.3) tr.push(["Blitzstarterin",`${p.first} Tore in den ersten 10 Minuten`]);
    if(p.late/tracked>=0.3) tr.push(["Schlussphase",`${p.late} Tore in den letzten 10 Minuten`]);
  }
  return tr;
}
const playerRow=(p,i,val,extra="")=>`<tr class="${p.team===US?"mine":""}"><td>${i+1}</td><td class="nm">${nrTag(p)}${esc(pName(p.name,p.team))}<br><span class="note">${esc(sn(p.team))}</span></td><td class="pts">${val}</td><td>${extra}</td></tr>`;
const playerTable=(head,rows)=>`<div class="tbl-wrap"><table class="ptbl"><thead><tr><th>#</th><th>Name</th><th>${head[0]}</th><th>${head[1]}</th></tr></thead><tbody>${rows||`<tr><td></td><td class="note">Noch keine Daten</td><td></td><td></td></tr>`}</tbody></table></div>`;

function viewOpponent(k){
  const g=upcoming(ALL.filter(x=>x.mine&&x.lg===k)).find(x=>x.dt&&realTeam(x.home)&&realTeam(x.away));
  if(!g) return `<section class="sec"><div class="empty">Zurzeit ist kein Gegner angesetzt.</div></section>`;
  const opp=g.home===US?g.away:g.home, P=teamProfile(k,opp), M=teamProfile(k,US), on=esc(sn(opp));
  let html=`<section class="board" aria-label="Nächster Gegner"><div class="when"><span class="lg">${k}-Jugend · nächster Gegner</span><span class="count">${countdown(g.dt)}</span></div>
    <div class="date">${on}</div>
    <p class="hall" style="margin:0">${WDL[g.dt.getDay()]}, ${g.dt.getDate()}. ${MONL[g.dt.getMonth()]}${g.time?`, ${esc(g.time)} Uhr`:""} · ${g.home===US?"Heimspiel":"Auswärts"}${P?`<br>Tabellenplatz ${P.rank} · ${esc(P.pts)} Punkte · ${P.t.w} S / ${P.t.x} U / ${P.t.l} N`:""}</p></section>`;
  if(!P) return html+`<section class="sec"><div class="empty">Von ${on} gibt es noch keine Spielberichte.</div></section>`;

  // Vergleich
  const q=v=>v==null?"–":Math.round(v*100)+" %";
  const rows=[["Tore pro Spiel",fmt1(M.t.gf/M.t.gp),fmt1(P.t.gf/P.t.gp)],["Gegentore pro Spiel",fmt1(M.t.ga/M.t.gp),fmt1(P.t.ga/P.t.gp)],
    ["7-Meter-Quote",q(M.q7),q(P.q7)],["Strafen pro Spiel",fmt1(M.pen),fmt1(P.pen)],["Zur Pause vorn",`${M.t.htLead}/${M.t.htGp}`,`${P.t.htLead}/${P.t.htGp}`]];
  html+=`<section class="sec"><h2>Direkter Zahlenvergleich</h2><div class="tbl-wrap"><table class="cmpt"><thead><tr><th>Wert</th><th>HC VG</th><th>${on}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="me">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></section>`;

  // Schlüsselspielerinnen
  // Schlüsselspielerinnen: Gegner links, unsere rechts (Platz 1 gegen Platz 1 usw.)
  const top=P.players.slice(0,4);
  const kcell=(p,tot,team)=>{ if(!p) return `<div class="kc"></div>`; const sh=tot?Math.round(p.g/tot*100):0;
    return `<div class="kc ${team===US?"us":""}"><b>${nrTag(p)}${esc(pName(p.name,team))}</b><span class="note">${p.g} ${p.g===1?"Tor":"Tore"} · Ø ${fmt1(p.g/p.gp)}</span><div class="ks"><span class="bar"><i style="width:${sh}%"></i></span><span>${sh} %</span></div></div>`; };
  const n4=Math.max(top.length,Math.min(4,M.players.length));
  const sevenTxt=(s,team)=>s?`${s.nr!=null?"#"+s.nr+" ":""}${esc(pName(s.name,team))} (${s.g7}/${s.a7})`:"–";
  html+=`<section class="sec"><h2>Schlüsselspielerinnen im Duell</h2><div class="card">
    <div class="kduel head"><span>${on}</span><span>HC VG</span></div>
    ${Array.from({length:n4},(_,i)=>`<div class="kduel"><i class="kr">${i+1}</i>${kcell(top[i],P.tot,opp)}${kcell(M.players[i],M.tot,US)}</div>`).join("")||'<span class="note">Keine Torschützinnen erfasst.</span>'}
    <div class="kduel seven"><span class="note">7m: ${sevenTxt(P.seven,opp)}</span><span class="note">7m: ${sevenTxt(M.seven,US)}</span></div>
    <span class="note">Zahl im Kreis = Rückennummer. Prozent = Anteil an allen Toren der eigenen Mannschaft.</span></div></section>`;

  // Steckbriefe der gefährlichsten Gegnerinnen
  const nb=leagueStats(k).nb;
  html+=`<section class="sec"><h2>Steckbriefe: auf diese Nummern achten</h2>${top.slice(0,3).map(p=>{
    const tracked=p.b.reduce((s,v)=>s+v,0), mx=Math.max(1,...p.b), tr=playerTraits(k,p,P.tot);
    return `<div class="sb"><div class="sbh"><span class="sbn">${p.nr??"?"}</span><div><b>${esc(p.name)}</b><span class="note">${on} · ${p.g} Tore in ${p.gp} ${p.gp===1?"Spiel":"Spielen"} · Ø ${fmt1(p.g/p.gp)}</span></div></div>
      ${tracked?`<div class="sbp" aria-label="Tore nach Spielphase">${p.b.map((v,i)=>`<div><span class="sbv">${v}</span><i style="height:${Math.round(v/mx*56)+2}px"></i><small>${i*10}′</small></div>`).join("")}</div>`:""}
      ${tr.length?`<ul class="sbt">${tr.map(([a,b])=>`<li><b>${a}</b> ${b}</li>`).join("")}</ul>`:""}
    </div>`;}).join("")||'<div class="empty">Keine Daten.</div>'}
    <span class="note">Balken = Tore je 10-Minuten-Abschnitt (${LEN[k]} Minuten Spielzeit). Abwehrleistung einzelner Spielerinnen steht nicht in den Spielberichten, nur Tore, Siebenmeter und Zeiten.</span></section>`;

  // Hinweise
  const S=leagueStats(k), T=Object.values(S.teams).filter(t=>t.gp), n=T.length;
  const avgQ=T.reduce((s,t)=>s+(t.s7?t.g7/t.s7:0),0)/n, avgPen=T.reduce((s,t)=>s+(t.rg?(t.y+t.m2+t.d)/t.rg:0),0)/n;
  const rankBy=(fn,low)=>1+T.filter(t=>low?fn(t)<fn(P.t):fn(t)>fn(P.t)).length;
  const tips=[];
  if(top[0]&&P.tot>=10){const s1=top[0].g/P.tot; if(s1>=0.3) tips.push(`<b>${top[0].nr!=null?"#"+top[0].nr+" ":""}${esc(top[0].name)}</b> wirft ${Math.round(s1*100)} % aller Tore von ${on}. Auf sie besonders achten.`);
    if(top[1]&&(top[0].g+top[1].g)/P.tot>=0.55) tips.push(`Zwei Spielerinnen (${top[0].nr!=null?"#"+top[0].nr+" ":""}${esc(top[0].name)} und ${top[1].nr!=null?"#"+top[1].nr+" ":""}${esc(top[1].name)}) werfen zusammen über die Hälfte der Tore.`);
    else if(P.players.filter(p=>p.g/P.tot>=0.1).length>=4) tips.push(`Die Tore sind breit verteilt – es gibt nicht die eine Spielerin, die man abmelden kann.`);}
  const rA=rankBy(t=>t.gf/t.gp), rD=rankBy(t=>t.ga/t.gp,true);
  if(rA<=2) tips.push(`Torgefährlich: ${fmt1(P.t.gf/P.t.gp)} Tore pro Spiel (Platz ${rA} der Liga).`);
  if(rD>=n-1) tips.push(`Die Abwehr wackelt: ${fmt1(P.t.ga/P.t.gp)} Gegentore pro Spiel (Platz ${rD} von ${n}).`);
  else if(rD<=2) tips.push(`Starke Abwehr: nur ${fmt1(P.t.ga/P.t.gp)} Gegentore pro Spiel. Geduld im Angriff.`);
  if(P.t.rg>=2){ if(P.t.b[P.segBest]>0) tips.push(`Am gefährlichsten in der ${segLabel(k,P.segBest)} (${P.t.b[P.segBest]} Tore insgesamt).`);
    if(P.t.bA[P.segWorst]>0) tips.push(`Die meisten Gegentore kassiert ${on} in der ${segLabel(k,P.segWorst)}.`); }
  if(P.nh>=2){ if(P.h2-P.h1>=1.5) tips.push(`Stark nach der Pause: In der 2. Halbzeit im Schnitt ${fmt1(P.h2-P.h1)} Tore besser als in der 1. – bis zum Schluss dranbleiben.`);
    else if(P.h1-P.h2>=1.5) tips.push(`Lässt nach der Pause nach: In der 2. Halbzeit im Schnitt ${fmt1(P.h1-P.h2)} Tore schlechter – Druck hochhalten.`); }
  if(P.q7!=null&&P.t.s7>=4){ if(P.q7<=avgQ-0.12) tips.push(`Unsicher vom Siebenmeter: nur ${P.t.g7} von ${P.t.s7} verwandelt.`); else if(P.q7>=avgQ+0.12) tips.push(`Sicher vom Siebenmeter: ${P.t.g7} von ${P.t.s7} verwandelt – Fouls im Kreis vermeiden.`); }
  if(P.t.rg&&P.pen>=avgPen*1.3) tips.push(`Viele Strafen: ${fmt1(P.pen)} pro Spiel (Liga-Schnitt ${fmt1(avgPen)}). Überzahl nutzen!`);
  html+=`<section class="sec"><h2>Worauf achten?</h2><div class="ais">${tips.map(t=>`<div class="ai pos"><span class="ic" aria-hidden="true" style="background:var(--court)">i</span><div><p style="margin:0;color:var(--ink)">${t}</p></div></div>`).join("")||'<div class="empty">Die Zahlen zeigen nichts Auffälliges.</div>'}</div></section>`;

  // Direkter Vergleich und gemeinsame Gegner
  const h2h=played(ALL.filter(x=>x.lg===k&&((x.home===US&&x.away===opp)||(x.home===opp&&x.away===US))));
  const diffOf=(team,other)=>ALL.filter(x=>x.lg===k&&x.res&&((x.home===team&&x.away===other)||(x.home===other&&x.away===team))).map(x=>{const [h,a]=x.res.split(":").map(Number);return x.home===team?h-a:a-h;});
  const common=Object.keys(S.teams).filter(t=>t!==US&&t!==opp&&realTeam(t)).map(t=>({t,us:diffOf(US,t),them:diffOf(opp,t)})).filter(c=>c.us.length&&c.them.length);
  const sgn=v=>(v>0?"+":"")+v;
  if(h2h.length||common.length) html+=`<section class="sec"><h2>Vergleich über die Ergebnisse</h2><div class="list">
    ${h2h.map(x=>`<div class="g mine"><div class="d">${x.dt.getDate()}. ${MON[x.dt.getMonth()]}<small>direkt</small></div><div class="mt"><div class="t">${teamHtml(x.home)} – ${teamHtml(x.away)}</div><div class="h">Bisheriges Duell in dieser Saison</div></div><div class="res ${outcome(x)}">${esc(x.res)}</div></div>`).join("")}
    ${common.map(c=>`<div class="g"><div class="d">vs<small>gemeinsam</small></div><div class="mt"><div class="t">${esc(sn(c.t))}</div><div class="h">HC VG ${c.us.map(sgn).join(", ")} · ${on} ${c.them.map(sgn).join(", ")}</div></div><span></span></div>`).join("")}
  </div><span class="note">Gemeinsame Gegner: Tordifferenz beider Teams gegen dieselbe Mannschaft.</span></section>`;
  html+=`<p class="note" style="margin:0">Automatisch aus ${P.t.rg} Spielberichten von ${on}. Bei wenigen Spielen sind die Zahlen nur ein grober Hinweis.</p>`;
  return html;
}

function viewLigaAna(k){
  const S=leagueStats(k), us=st.ligaUs;
  const pool=S.players.filter(p=>p.g>0&&(!us||p.team===US));
  let html=`<section class="sec"><div class="chips" role="group" aria-label="Filter"><button class="chip" data-ligaus="0" aria-pressed="${!us}">Ganze Liga</button><button class="chip" data-ligaus="1" aria-pressed="${us}">Nur HC VG</button></div></section>`;
  const topG=[...pool].sort((a,b)=>b.g-a.g||a.gp-b.gp).slice(0,5);
  html+=`<section class="sec"><h2>Die meisten Tore</h2>${playerTable(["Tore","Ø"],topG.map((p,i)=>playerRow(p,i,p.g,fmt1(p.g/p.gp))).join(""))}</section>`;
  const topA=pool.filter(p=>p.gp>=2).sort((a,b)=>b.g/b.gp-a.g/a.gp).slice(0,5);
  html+=`<section class="sec"><h2>Bester Schnitt pro Spiel</h2>${playerTable(["Ø","Spiele"],topA.map((p,i)=>playerRow(p,i,fmt1(p.g/p.gp),p.gp)).join(""))}<span class="note">Ab 2 Spielen.</span></section>`;
  const top7=S.players.filter(p=>p.a7>=(us?2:4)&&(!us||p.team===US)).sort((a,b)=>b.g7/b.a7-a.g7/a.a7||b.a7-a.a7).slice(0,5);
  html+=`<section class="sec"><h2>Sicherste Siebenmeter</h2>${playerTable(["Quote","Treffer"],top7.map((p,i)=>playerRow(p,i,Math.round(p.g7/p.a7*100)+" %",`${p.g7}/${p.a7}`)).join(""))}<span class="note">Ab ${us?2:4} Versuchen.</span></section>`;

  const teams=LEAGUES[k].table.map(r=>r[0]).filter(t=>realTeam(t)&&(!us||t===US)).map(t=>teamProfile(k,t)).filter(Boolean);
  if(us){
    const M=teams[0];
    if(M) html+=`<section class="sec"><h2>Wie verteilen sich unsere Tore?</h2><div class="card">${M.players.map(p=>{const sh=M.tot?p.g/M.tot:0;return `<div class="kp"><div class="kn"><b>${esc(pName(p.name,US))}</b><span class="note">${p.g} ${p.g===1?"Tor":"Tore"} · Ø ${fmt1(p.g/p.gp)}</span></div><div class="ks"><span class="bar"><i style="width:${Math.round(sh*100)}%"></i></span><span>${Math.round(sh*100)} %</span></div></div>`;}).join("")}</div></section>`;
  } else {
    html+=`<section class="sec"><h2>Schlüsselspielerinnen je Team</h2><div class="list">${teams.map(P=>{const p=P.players[0];const sh=p&&P.tot?Math.round(p.g/P.tot*100):0;
      return `<div class="g ${P.t.name===US?"mine":""}"><div class="d">${P.rank}.<small>Platz</small></div><div class="mt"><div class="t">${teamHtml(P.t.name)}</div><div class="h">${p?`Top: <b>${p.nr!=null?"#"+p.nr+" ":""}${esc(pName(p.name,P.t.name))}</b> ${p.g} Tore (${sh} %)`:"keine Daten"}${P.seven?` · 7m: ${esc(pName(P.seven.name,P.t.name))} ${P.seven.g7}/${P.seven.a7}`:""}</div></div><span></span></div>`;}).join("")}</div>
      <span class="note">Prozent = Anteil an allen Toren der Mannschaft. Je höher, desto abhängiger ist das Team von dieser Spielerin.</span></section>`;
    const pick=(fn,low,filt=()=>true)=>{const c=teams.filter(filt);return c.length?c.reduce((b,P)=>(low?fn(P)<fn(b):fn(P)>fn(b))?P:b):null;};
    const facts=[];
    const a=pick(P=>P.t.gf/P.t.gp); if(a) facts.push(["Torreichster Angriff",a,`${fmt1(a.t.gf/a.t.gp)} Tore pro Spiel`]);
    const d=pick(P=>P.t.ga/P.t.gp,true); if(d) facts.push(["Beste Abwehr",d,`${fmt1(d.t.ga/d.t.gp)} Gegentore pro Spiel`]);
    const h=pick(P=>P.h2-P.h1,false,P=>P.nh>=2); if(h&&h.h2-h.h1>0) facts.push(["Stärkste zweite Halbzeit",h,`${fmt1(h.h2-h.h1)} Tore besser als in der 1. Halbzeit`]);
    const dep=pick(P=>P.tot?P.players[0].g/P.tot:0,false,P=>P.tot>=15); if(dep) facts.push(["Am meisten von einer Spielerin abhängig",dep,`${esc(pName(dep.players[0].name,dep.t.name))} wirft ${Math.round(dep.players[0].g/dep.tot*100)} % der Tore`]);
    const spread=pick(P=>P.players.filter(p=>p.g/P.tot>=0.1).length,false,P=>P.tot>=15); if(spread) facts.push(["Tore am breitesten verteilt",spread,`${spread.players.filter(p=>p.g/spread.tot>=0.1).length} Spielerinnen mit mindestens 10 % der Tore`]);
    const fair=pick(P=>P.pen,true,P=>P.t.rg>=2); if(fair) facts.push(["Fairste Mannschaft",fair,`${fmt1(fair.pen)} Strafen pro Spiel`]);
    const rough=pick(P=>P.pen,false,P=>P.t.rg>=2); if(rough&&rough!==fair) facts.push(["Die meisten Strafen",rough,`${fmt1(rough.pen)} pro Spiel`]);
    const sv=pick(P=>P.q7??0,false,P=>P.t.s7>=5); if(sv) facts.push(["Sicherste Siebenmeter",sv,`${sv.t.g7} von ${sv.t.s7} verwandelt`]);
    html+=`<section class="sec"><h2>Auffälligkeiten in der Liga</h2><div class="ais">${facts.map(([t,P,x])=>`<div class="ai ${P.t.name===US?"pos":""}"><span class="ic" aria-hidden="true" style="background:${P.t.name===US?"var(--win)":"var(--court)"}">${P.rank}</span><div><b>${esc(t)}: ${esc(sn(P.t.name))}</b><p>${x}</p></div></div>`).join("")}</div><span class="note">Zahl im Kreis = Tabellenplatz.</span></section>`;
  }
  html+=`<p class="note" style="margin:0">Alle Werte aus den genehmigten Spielberichten der Liga. Namen sind gekürzt.</p>`;
  return html;
}

/* Schalter: Liga-Analyse und Gegner-Check lassen sich hier wieder ausblenden (false) */
const FEATURE_GEGNER=true, FEATURE_LIGA=true;

function viewAnalysis(){
  const k=st.ana;
  const modes=[["team","Unser Team"]].concat(FEATURE_GEGNER?[["gegner","Gegner-Check"]]:[],FEATURE_LIGA?[["liga","Liga"]]:[]);
  if(!modes.some(m=>m[0]===st.anaMode)) st.anaMode="team";
  const ch=id=>`<button class="chip" data-ana="${id}" aria-pressed="${k===id}">${id}-Jugend</button>`;
  let html=`<section class="sec"><div class="sechead"><h2>Analyse</h2><div class="chips" role="group" aria-label="Mannschaft">${ch("D")}${ch("C")}</div></div>
    ${modes.length>1?`<div class="sub" role="tablist" aria-label="Bereich">${modes.map(([id,l])=>`<button role="tab" data-anamode="${id}" aria-selected="${st.anaMode===id}">${l}</button>`).join("")}</div>`:""}</section>`;
  return html+(st.anaMode==="gegner"?viewOpponent(k):st.anaMode==="liga"?viewLigaAna(k):viewTeamAna(k));
}

function viewTeamAna(k){
  const A=analyse(k);
  let html=`<section class="sec">`;
  if(!A) return html+`<div class="empty">Noch keine Spiele mit Spielbericht.</div></section>`;
  const m=A.me;
  const lead=A.plus[0], weak=A.minus[0];
  html+=`<div class="board ana-sum"><span class="lg" style="align-self:flex-start">Kurz gesagt</span>
    <p class="sum">Platz ${A.rank} von ${A.n}, ${m.w} ${m.w===1?"Sieg":"Siege"}, ${m.x} Remis, ${m.l} ${m.l===1?"Niederlage":"Niederlagen"}.${A.leader?` Tabellenführer ist ${esc(A.leader[0])} (${esc(A.leader[1])} Punkte).`:" Tabellenführer!"}${lead?` Größte Stärke: <b>${esc(lead.t)}</b>.`:""}${weak?` Größte Baustelle: <b>${esc(weak.t)}</b>.`:""}</p></div></section>`;
  html+=`<section class="sec"><h2>Im Vergleich mit der Liga</h2>
    <div class="tbl-wrap"><table class="cmpt"><thead><tr><th>Wert</th><th>HC VG</th><th>Liga-Ø</th><th>Bestes anderes Team</th></tr></thead><tbody>${
      A.rows.map(r=>`<tr><td>${esc(r.l)}<small>Platz ${r.rk} von ${A.nT}${r.lg?" · weniger ist besser":""}</small></td><td class="me">${r.me}</td><td>${r.avg}</td><td>${r.best}<small>${esc(r.bn)}</small></td></tr>`).join("")
    }</tbody></table></div></section>`;
  const card=(it,cls)=>`<div class="ai ${cls}"><span class="ic" aria-hidden="true">${cls==="pos"?"✓":"!"}</span><div><b>${esc(it.t)}</b><p>${it.x}</p></div></div>`;
  html+=`<section class="sec"><h2>Das zeichnet die Mannschaft aus</h2><div class="ais">${A.plus.map(i=>card(i,"pos")).join("")||'<div class="empty">Noch keine klaren Stärken in den Zahlen – dafür braucht es mehr Spiele.</div>'}</div></section>`;
  html+=`<section class="sec"><h2>Hier ist noch Luft nach oben</h2><div class="ais">${A.minus.map(i=>card(i,"neg")).join("")||'<div class="empty">Die Zahlen zeigen keine echte Schwachstelle. Weiter so!</div>'}</div></section>`;
  html+=`<section class="sec"><h2>Mögliche Trainingsschwerpunkte</h2><ol class="focus">${A.focus.map(i=>`<li><b>${esc(i.f[0])}</b><span>${esc(i.f[1])}</span><small>Weil: ${esc(i.t)}</small></li>`).join("")||'<li><b>Weiter wie bisher</b><span>Die Zahlen geben keinen klaren Schwerpunkt vor.</span></li>'}</ol></section>`;
  html+=`<p class="note" style="margin:0">Automatisch berechnet aus ${A.rg} Spielberichten von nuLiga und verglichen mit allen Teams der Liga. Die Auswertung läuft nach festen Regeln, die ich für die App geschrieben habe, und aktualisiert sich mit jedem neuen Spiel. Sie kennt nur Tore, Siebenmeter, Strafen und Spielzeiten, keine Würfe, Paraden oder Fehlpässe. Bei wenigen Spielen sind die Zahlen noch wackelig. Den Blick des Trainerteams ersetzt sie nicht.</p>`;
  return html;
}

/* ---------- Steuerung ---------- */
let current="us";
try{const s=localStorage.getItem("hcvg-tab");if(s&&["us","D","C","ana"].includes(s))current=s;const a=localStorage.getItem("hcvg-ana");if(a==="C"||a==="D")st.ana=a;const am=localStorage.getItem("hcvg-anamode");if(am)st.anaMode=am;}catch(e){}
function save(){try{localStorage.setItem("hcvg-tab",current);localStorage.setItem("hcvg-ana",st.ana);localStorage.setItem("hcvg-anamode",st.anaMode);localStorage.setItem("hcvg-sub",JSON.stringify(st.sub));}catch(e){}}
// Einblend-Animation nur beim Wechsel von Seite/Unterreiter, nicht bei Filter- oder Sortierknöpfen
let animNext=true;
function render(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===current));
  view.innerHTML = current==="us"?viewUs():current==="ana"?viewAnalysis():viewLeague(current);
  view.classList.remove("anim");
  if(animNext){ [...view.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8))); void view.offsetWidth; view.classList.add("anim"); }
  animNext=false;
  document.getElementById("stand").textContent=`Datenstand: ${DATA.updated} · Quelle: nuLiga HVMV (BHV Ost 2026/27). Ohne Gewähr – kurzfristige Verlegungen bitte beim Trainer erfragen.`;
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{current=b.dataset.view;save();animNext=true;render();window.scrollTo({top:0});}));
view.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const k=current;
  if(b.dataset.go){const [lg,sub]=b.dataset.go.split(":");current=lg;st.sub[lg]=sub;save();animNext=true;render();window.scrollTo({top:0});return;}
  if(b.dataset.sub){st.sub[k]=b.dataset.sub;save();animNext=true;render();return;}
  if(b.dataset.f){st.filterMine[k]=b.dataset.f==="us";render();return;}
  if(b.dataset.sort){st.sort[k]=b.dataset.sort;render();return;}
  if(b.dataset.top){st.topAll[k]=!st.topAll[k];render();return;}
  if(b.dataset.topus){st.topUs[k]=b.dataset.topus==="1";render();return;}
  if(b.dataset.ana){st.ana=b.dataset.ana;save();animNext=true;render();return;}
  if(b.dataset.cal){st.cal=b.dataset.cal;render();return;}
  if(b.dataset.anamode){st.anaMode=b.dataset.anamode;save();animNext=true;render();return;}
  if(b.dataset.ligaus){st.ligaUs=b.dataset.ligaus==="1";render();return;}
  if(b.dataset.gegner){current="ana";st.ana=b.dataset.gegner;st.anaMode="gegner";save();animNext=true;render();window.scrollTo({top:0});return;}
  if(b.dataset.copycal){
    const url=calUrls().https, done=t=>{b.textContent=t;setTimeout(()=>b.textContent="Adresse kopieren",2500);};
    try{navigator.clipboard.writeText(url).then(()=>done("Kopiert ✓"),()=>{prompt("Kalender-Adresse:",url);});}catch(e){prompt("Kalender-Adresse:",url);}
    return;
  }
  if(b.dataset.cmp){st.cmp[k]=b.dataset.cmp;render();return;}
});
render();
</script>
